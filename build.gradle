buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        jcenter()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
        maven { url "https://maven.google.com/" }
    }
    dependencies {
        classpath 'org.mini2Dx:parcl:1.6.1'
        classpath 'org.mini2Dx:butler:1.1.3'
    }
}

allprojects {
    apply plugin: "eclipse"
    apply plugin: "idea"
    apply plugin: "java"

    // Esto se queda por si acaso
    sourceCompatibility = 17
    targetCompatibility = 17

    version = '1.0.0'
    ext {
        appName = 'NuestroJuego'
        mini2DxVersion = '1.9.10'
        gdxVersion = '1.9.8'
        roboVMVersion = '2.3.7'
        minibusVersion = '1.3.0'
        miniscriptVersion = '1.1.1'
        box2DLightsVersion = '1.4'
        ashleyVersion = '1.7.0'
        aiVersion = '1.8.0'
        androidBsfVersion = '3.1.3'
    }

    repositories {
        mavenLocal()
        mavenCentral()
        jcenter()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
        maven { url "https://maven.google.com/" }
    }
}

project(":core") {
    apply plugin: "java"

    // Esto obliga a usar el compilador de Java 17 sí o sí
    compileJava {
        options.release = 17
    }

    dependencies {
        implementation "org.mini2Dx:mini2Dx-core:$mini2DxVersion"
        implementation "org.mini2Dx:mini2Dx-tiled:$mini2DxVersion"
        implementation "org.mini2Dx:mini2Dx-artemis-odb:$mini2DxVersion"
        implementation "org.mini2Dx:mini2Dx-ui:$mini2DxVersion"
        implementation "org.mini2Dx:mini2Dx-core:$minibusVersion"
        implementation "com.badlogicgames.gdx:gdx-ai:$aiVersion"
    }
}

project(":desktop") {
    apply plugin: "java"
    apply plugin: "application"
    apply plugin: "org.mini2Dx.parcl"
    apply plugin: "org.mini2Dx.butler"

    // REFUERZO PARA EL DESKTOP
    sourceCompatibility = 17
    targetCompatibility = 17

    mainClassName = "com.nuestrojuego.hectorycristian.desktop.DesktopLauncher"

    dependencies {
        implementation project(":core")
        implementation "org.mini2Dx:mini2Dx-desktop:$mini2DxVersion"
    }

    // He quitado los bloques parcl y butler para que no den error con Gradle 7.5+
    // Si quieres generar el EXE luego, los volveremos a poner.
}

tasks.eclipse.doLast {
    delete ".project"
}